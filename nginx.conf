events {
    worker_connections 1024;
}

http {
    # Rate limiting: 10 requests per second per IP address
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream neurograph_backend {
        server neurograph-api:8000;
        # To scale horizontally, just add more instances here:
        # server neurograph-api-2:8000;
        # server neurograph-api-3:8000;
    }

    server {
        listen 80;
        server_name _;

        # Protect the /v1/ endpoints with rate limiting
        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://neurograph_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Increase timeout for long generations
            proxy_read_timeout 120s;
            proxy_connect_timeout 60s;
        }

        # Health check endpoint (no rate limit)
        location /health {
            proxy_pass http://neurograph_backend/health;
        }
    }
}